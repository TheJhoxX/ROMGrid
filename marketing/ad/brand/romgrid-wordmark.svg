<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">ROMGrid logo</title>
  <desc id="desc">ROMGrid symbol and wordmark</desc>
  <defs>
    <linearGradient id="tile-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF5378"/>
      <stop offset="0.48" stop-color="#D7669B"/>
      <stop offset="1" stop-color="#529AD6"/>
    </linearGradient>
    <linearGradient id="word-gradient" x1="688" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EF5378"/>
      <stop offset="1" stop-color="#529AD6"/>
    </linearGradient>
  </defs>

  <g id="romgrid-symbol" transform="translate(20 20) scale(.625)">
    <rect width="512" height="512" rx="48" fill="#1F2839"/>
    <path d="M120 64H392C423 64 448 89 448 120V392C448 423 423 448 392 448H184L64 328V120C64 89 89 64 120 64Z" fill="#FFFFFF"/>
    <g fill="url(#tile-gradient)">
      <rect x="120" y="120" width="120" height="120" rx="30"/>
      <rect x="272" y="120" width="120" height="120" rx="30"/>
      <rect x="120" y="272" width="120" height="120" rx="30"/>
      <rect x="272" y="272" width="120" height="120" rx="30"/>
    </g>
  </g>

  <text id="wordmark-rom" x="392" y="222" fill="#1F2839" font-family="Geist, sans-serif" font-size="170" font-weight="900" letter-spacing="-9">ROM</text>
  <text id="wordmark-grid" x="744" y="222" fill="url(#word-gradient)" font-family="Geist, sans-serif" font-size="170" font-weight="900" letter-spacing="-9">Grid</text>
</svg>
