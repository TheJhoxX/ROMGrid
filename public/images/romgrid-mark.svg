<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ROMGrid symbol</title>
  <desc id="desc">A four-tile grid inside a simplified game cartridge</desc>
  <defs>
    <linearGradient id="tile-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF5378"/>
      <stop offset="0.48" stop-color="#D7669B"/>
      <stop offset="1" stop-color="#529AD6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="48" fill="#1F2839"/>

  <!-- A reduced cartridge silhouette: one shape, no micro-copy. -->
  <path
    d="M120 64H392C423 64 448 89 448 120V392C448 423 423 448 392 448H184L64 328V120C64 89 89 64 120 64Z"
    fill="#FFFFFF"
  />

  <!-- Four console-icon tiles. The wider central gap stays clear at favicon size. -->
  <g fill="url(#tile-gradient)">
    <rect x="120" y="120" width="120" height="120" rx="30"/>
    <rect x="272" y="120" width="120" height="120" rx="30"/>
    <rect x="120" y="272" width="120" height="120" rx="30"/>
    <rect x="272" y="272" width="120" height="120" rx="30"/>
  </g>

</svg>
